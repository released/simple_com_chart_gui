; Named view changes display only: checked channels/table columns, four plot choices, windows and fixed Y. Save current, Stage/import, then explicitly Apply. Unknown keys are reported and remain none; new keys never auto-enable. Unfreeze Snapshot before Apply. Serial, parser, capture and raw recordings stay unchanged.
