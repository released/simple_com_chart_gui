; Export the actual selected Chart or four independent plots as PNG, including axes and latest labels. Snapshot remains freeze. Four plots need at least 800x600; maximum 4096 per dimension and 16 million pixels. Rendering captures the current view; encoding/save run in background with atomic replacement.
S_DCB9206832550B43=將目前選定的主圖或四個獨立小圖匯出為 PNG，包含座標與最新數值標記。凍結功能仍只負責凍結圖表。四圖至少 800×600；每邊最多 4096 像素，總計最多 1600 萬像素。先擷取目前畫面，再於背景編碼並以原子方式儲存。
; Manual recording annotations, not trigger recording. Choose a completed source file and exact byte offset/count; SHA256 and size bind notes to that file. Save .sccnotes beside the source; load verifies it before staging. Locate requires the identical single-file recording already loaded in replay; it pauses/seeks without TX. Clear only discards staged notes, never source or saved files.
S_53117047B53A1B40=手動錄製註解。選擇已完成的來源檔並輸入精確位元組位移／數量；註解以 SHA256 與長度綁定檔案。將 .sccnotes 存在來源旁，載入時先驗證。定位要求同一個單檔錄製已載入重播，只會暫停與定位，不傳送。清除只丟棄暫存註解，不刪除檔案。
; Self-contained static HTML with selected retained raw numeric fields, summary statistics and bounded SVG plots. One exact key per line, up to eight. Times are inclusive capture-relative seconds. No scripts, CDN or browser engine. This snapshot excludes later RX and complete raw recordings; missing values/generation changes break plotted segments.
S_0E76B22E8F0DF880=獨立的靜態 HTML，包含指定的保留原始數值欄位、統計與有界 SVG 圖表。每行一個完整名稱，最多八個；時間是包含端點的擷取相對秒數。不使用腳本、CDN 或瀏覽器引擎。快照不含後續接收與完整 raw；缺值或連線代次改變會切斷繪圖線段。
; Bounded grayscale time-frequency history using Hann/mean-removed FFT, newest row at bottom. 32..4096 power-of-two samples, 1..256 rows, at most two background frames per second. Rate 0 validates source clocks; explicit device rate is an assumption, not resampling or wire timing. Hidden/stopped pages do not calculate. Gaps, generation/key/configuration changes reset history.
S_FC5071718D9D5747=灰階時頻歷程，採用 Hann 視窗並移除平均值，最新一列在下方。FFT 樣本須為 32～4096 的二次方，歷史 1～256 列，每秒最多兩次背景計算。取樣率 0 會檢查來源時鐘；手動裝置取樣率是一項假設，不是重取樣或線路時序。隱藏／停止後不計算；缺口、連線代次、欄位或設定改變會重設歷史。
; Exact retained text input, excluding the explicit B display prefix. Expected values are observations from the case editor parser, not independent proof. Review/edit expected values before accepting. This only appends a private offline case; it never applies a parser or transmits.
